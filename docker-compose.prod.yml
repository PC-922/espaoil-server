version: '3.8'

services:
  espaoilserver:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: espaoilserver
    environment:
      DATABASE_URL: mongodb://user:password@mongodb:27017/espaoil?authSource=admin&ssl=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - coolify
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7
    container_name: espaoil_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: espaoil
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  coolify:
    external: true
  backend:

volumes:
  mongodb_data:
